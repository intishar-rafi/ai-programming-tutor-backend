<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor Dev UI</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2125; --muted: #6b7280;
    --border: #d9dde3; --accent: #2563eb; --accent-text: #ffffff;
    --tutor: #eef2f7; --student: #dbeafe; --hint: #fef3c7; --hint-border: #f59e0b;
    --error: #b91c1c; --code-bg: #fbfbfc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1e24; --text: #e5e7eb; --muted: #9ca3af;
      --border: #2d333b; --accent: #3b82f6; --accent-text: #ffffff;
      --tutor: #232a33; --student: #1e3a5f; --hint: #3a2f12; --hint-border: #d97706;
      --error: #f87171; --code-bg: #14171c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header label { color: var(--muted); font-size: 12px; }
  header input { font: inherit; padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: 180px 1fr 1fr; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 10px 12px 6px; }
  #projects { list-style: none; margin: 0; padding: 0 6px; overflow: auto; }
  #projects li button {
    width: 100%; text-align: left; padding: 6px 8px; border: 0; border-radius: 4px;
    background: transparent; color: var(--text); font: inherit; cursor: pointer;
  }
  #projects li button:hover { background: var(--tutor); }
  #projects .empty { color: var(--muted); padding: 6px 8px; font-size: 13px; }
  #editor {
    flex: 1; margin: 0 12px; padding: 10px; resize: none; tab-size: 4;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    border: 1px solid var(--border); border-radius: 6px; background: var(--code-bg); color: var(--text);
  }
  .bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; }
  .bar .info { color: var(--muted); font-size: 12px; }
  button.primary, button.secondary {
    font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer; border: 1px solid var(--accent);
  }
  button.primary { background: var(--accent); color: var(--accent-text); }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow: auto; padding: 4px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; max-width: 92%; }
  .msg.tutor { background: var(--tutor); align-self: flex-start; }
  .msg.student { background: var(--student); align-self: flex-end; }
  .msg.hint { background: var(--hint); border-left: 3px solid var(--hint-border); align-self: flex-start; }
  .msg.error { color: var(--error); align-self: center; font-size: 13px; }
  .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  #chat-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  #chat-input { flex: 1; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-auto-rows: minmax(260px, auto); overflow: auto; }
    section { border-right: 0; border-bottom: 1px solid var(--border); }
    #editor { min-height: 220px; }
  }
</style>
</head>
<body>
<header>
  <h1>Tutor Dev UI</h1>
  <label>Backend <input id="api" size="24"></label>
  <label>Session <input id="session" size="12"></label>
  <button class="secondary" id="new-session" type="button">New session</button>
  <span id="status"></span>
</header>

<main>
  <section>
    <h2>Projects</h2>
    <ul id="projects"></ul>
  </section>

  <section>
    <h2 id="editor-title">Editor</h2>
    <textarea id="editor" spellcheck="false" placeholder="Choose or create a project in chat, then write code here and press Save."></textarea>
    <div class="bar">
      <button class="primary" id="save" type="button">Save (Ctrl+S)</button>
      <span class="info" id="save-info"></span>
    </div>
  </section>

  <section>
    <h2>Chat</h2>
    <div id="log"></div>
    <form id="chat-form">
      <input id="chat-input" autocomplete="off" placeholder="Type a message…">
      <button class="primary" type="submit">Send</button>
      <button class="secondary" id="hint" type="button">Hint</button>
    </form>
  </section>
</main>

<script>
// Throwaway test UI for the backend — talks to the same endpoints the Lovable frontend uses.
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

$("api").value = store.get("api") || "http://localhost:8000";
$("session").value = store.get("session") || newId();
$("api").onchange = () => { store.set("api", $("api").value.trim()); init(); };
$("session").onchange = () => { store.set("session", $("session").value.trim()); init(); };
$("new-session").onclick = () => { $("session").value = newId(); store.set("session", $("session").value); init(); };

function newId() { return "dev-" + Math.random().toString(36).slice(2, 8); }
const api = () => $("api").value.replace(/\/$/, "");
const sid = () => $("session").value.trim();

function addMsg(kind, text, meta) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  if (meta) setMeta(el, meta);
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}
function setMeta(el, meta) {
  let m = el.querySelector(".meta");
  if (!m) { m = document.createElement("span"); m.className = "meta"; el.appendChild(m); }
  m.textContent = meta;
}
function busy(on, label) {
  for (const b of document.querySelectorAll("#chat-form button, #save")) b.disabled = on;
  $("status").textContent = on ? label : "";
}
const secs = (t0) => ((performance.now() - t0) / 1000).toFixed(1) + "s";

async function postJSON(path, body) {
  const r = await fetch(api() + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
  return r;
}

async function loadProjects() {
  const ul = $("projects");
  ul.innerHTML = "";
  try {
    const { projects } = await (await fetch(api() + "/projects")).json();
    if (!projects.length) { ul.innerHTML = '<li class="empty">No projects yet</li>'; return; }
    for (const name of projects) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.textContent = name;
      b.onclick = () => selectProject(name);
      li.appendChild(b);
      ul.appendChild(li);
    }
  } catch { ul.innerHTML = '<li class="empty">Backend unreachable</li>'; }
}

async function selectProject(name) {
  try {
    const data = await (await postJSON("/select_project", { session_id: sid(), project_name: name })).json();
    if (data.status !== "ok") return addMsg("error", data.message);
    $("editor").value = data.content || "";
    $("editor-title").textContent = "Editor — " + name + "/main.py";
    addMsg("tutor", data.message);
  } catch (e) { addMsg("error", e.message); }
}

async function sendChat(text) {
  addMsg("student", text);
  const el = addMsg("tutor", "");
  const t0 = performance.now();
  let first = null;
  busy(true, "Waiting for the model…");
  try {
    const r = await postJSON("/chat", { session_id: sid(), message: text });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let out = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (first === null) first = secs(t0);
      out += dec.decode(value, { stream: true });
      el.firstChild ? (el.firstChild.textContent = out) : (el.textContent = out);
      $("log").scrollTop = $("log").scrollHeight;
    }
    setMeta(el, `first chunk ${first ?? "–"} · total ${secs(t0)}`);
    if (/Let's get started/.test(out)) loadProjects();
  } catch (e) { el.remove(); addMsg("error", e.message); }
  busy(false);
}

async function getHint() {
  const t0 = performance.now();
  busy(true, "Generating hint…");
  try {
    const data = await (await postJSON("/hint", { session_id: sid() })).json();
    const label = data.level ? `Hint ${data.level}/4` : "Hint";
    addMsg("hint", data.hint, `${label} · ${secs(t0)}`);
  } catch (e) { addMsg("error", e.message); }
  busy(false);
}

async function save() {
  try {
    const data = await (await postJSON("/upload", { session_id: sid(), content: $("editor").value, filename: "main.py" })).json();
    if (data.status !== "ok") return addMsg("error", data.message);
    $("save-info").textContent = `Saved ${data.lines} lines at ${new Date().toLocaleTimeString()} — hints reset to level 0`;
  } catch (e) { addMsg("error", e.message); }
}

$("chat-form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("chat-input").value.trim();
  if (!text) return;
  $("chat-input").value = "";
  sendChat(text);
};
$("hint").onclick = getHint;
$("save").onclick = save;
$("editor").addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.setRangeText("    ", s, t.selectionEnd, "end");
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
});

async function init() {
  $("log").innerHTML = "";
  $("editor").value = "";
  $("editor-title").textContent = "Editor";
  $("save-info").textContent = "";
  loadProjects();
  try {
    const { message } = await (await fetch(api() + "/greeting")).json();
    addMsg("tutor", message);
  } catch {
    addMsg("error", `Can't reach ${api()} — is uvicorn running?`);
  }
}
init();
</script>
</body>
</html>
